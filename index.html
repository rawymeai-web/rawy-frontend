    (function() {
      try {
        var saved = localStorage.getItem('preferred_language');
        var navLangs = navigator.languages || [navigator.language || ''];
        var primaryLang = '';
        for (var i = 0; i < navLangs.length; i++) {
          if (navLangs[i]) {
            var code = navLangs[i].toLowerCase().split('-')[0];
            if (code === 'ar') { primaryLang = 'ar'; break; }
            if (['en', 'de', 'tr', 'zh', 'ja', 'fr', 'es', 'it', 'pt', 'ru'].indexOf(code) !== -1 && !primaryLang) {
              primaryLang = code;
            }
          }
        }
        var activeLang = saved || primaryLang || 'en';
        document.documentElement.lang = activeLang;
        document.documentElement.dir = (activeLang === 'ar') ? 'rtl' : 'ltr';
      } catch(e) {}
    })();
  </script>

  <style>
    @keyframes page-enter-forward {
      from { opacity: 0; transform: scale(0.95) translateY(20px); filter: blur(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .animate-enter-forward {

    .glass-panel {

      transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-panel:hover {

    }

    .apple-display-heading {

    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .blob {
      position: fixed;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Custom scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes stitch-slide-in {
      0% { opacity: 0; transform: translateX(20px) scale(0.98); filter: blur(10px); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }

    @keyframes stitch-fade-out {
      0% { opacity: 1; transform: scale(1); filter: blur(0); }
      100% { opacity: 0; transform: scale(1.05); filter: blur(5px); }
    }

    .animate-stitch-in {
      animation: stitch-slide-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-stitch-out {
      animation: stitch-fade-out 0.4s ease-in forwards;
    }

    body {
      background-color: #FFF9F0;
      color: #001A40;
    }

    /* Accessibility Overrides */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-delay: 0s !important;
        animation-duration: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0s !important;
        scroll-behavior: auto !important;
        transform: none !important;
      }
      .animate-enter-forward {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .animate-stitch-in, .animate-stitch-out {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .glass-panel, header, .header-blur {
        background: #FFFFFF !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 1.5px solid #001A40 !important;
      }
    }

    @media (prefers-contrast: more) {
      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
      }
      .glass-panel {
        border: 2px solid #001A40 !important;
      }
    }

    /* Reset letter-spacing in RTL/Arabic contexts to prevent cursive letters from disconnecting */
    [dir="rtl"] *, [lang="ar"] * {
      letter-spacing: normal !important;
    }
